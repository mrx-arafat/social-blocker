<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Social Blocker</title>
  </head>
  <body>
    <header class="pop-head">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">Social Blocker</span>
      </div>
      <label class="switch" title="Enable / disable">
        <input type="checkbox" id="masterToggle" />
        <span class="slider"></span>
      </label>
    </header>

    <section class="psy-row">
      <div class="psy-card">
        <div class="psy-num" id="pStreak">0</div>
        <div class="psy-label">calm-day streak</div>
        <div class="psy-sub" id="pBest"></div>
      </div>
      <div class="psy-card">
        <div class="psy-num" id="pReclaimed">0m</div>
        <div class="psy-label">time reclaimed</div>
      </div>
    </section>

    <section class="stat-row">
      <div class="stat">
        <div class="stat-num" id="sAttempts">0</div>
        <div class="stat-label">Caught</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="sDismissed">0</div>
        <div class="stat-label">Stepped away</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="sRate">0%</div>
        <div class="stat-label">Resisted</div>
      </div>
    </section>

    <p class="today-note" id="todayNote">No interruptions yet today.</p>

    <section id="siteToday" class="site-today"></section>

    <button id="strictNow" class="pop-btn ghost">Strict now — 1h</button>
    <button id="openOptions" class="pop-btn">Settings &amp; blocked sites</button>
  </body>
  <script type="module" src="popup.js"></script>
</html>
